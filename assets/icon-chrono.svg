<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="chronoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="44" fill="#090d16" stroke="url(#chronoGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="#38bdf8" stroke-dasharray="6,4" stroke-width="2"/>
  <polygon points="50,20 62,45 85,50 62,55 50,80 38,55 15,50 38,45" fill="url(#chronoGrad)" />
  <circle cx="50" cy="50" r="8" fill="#ffffff" filter="url(#glow)"/>
</svg>
